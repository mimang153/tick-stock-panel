# pre-commit 强门禁（不做打包，只守代码质量）
#
# 原则：
#   - 增量执行：pre-commit 默认只检查「本次改动涉及的文件」，避免存量代码
#     的既有问题阻塞提交（存量基线见 backend/pyproject.toml ruff 注释）。
#   - 后端：ruff lint（含复杂度 C901）+ ruff 格式化 + 通用卫生 + 行数门禁；
#     前端：TypeScript 类型检查（strict）。
#   - 密钥/token 泄露扫描不在提交门禁内（gitleaks 环境依赖 Go，安装受宿主安全策略
#     限制）；私钥检测仍由通用卫生的 detect-private-key 兜底，完整密钥扫描交给 CI。
#   - 安装后首次使用本地环境即可：
#       pip install pre-commit && pre-commit install
#
# 说明：
#   - 某些规则若需豁免单个文件/单行，用 ruff 的 per-file-ignores 或 `# noqa:`
#     显式声明，不要删整条规则。
#   - 有意未加入、请勿贪多硬塞的项及原因见文末「未启用项及理由」。

repos:
  # ---------- 通用仓库卫生（零风险、全面兜底） ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # --- 空白/行尾 ---
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: (^frontend/|\.svg$|\.json$|\.min\.)
      - id: mixed-line-ending
        args: ["--fix=lf"]
        types_or: [python, javascript, jsx, ts, tsx, css, yaml, toml]
      # --- 语法/一致性 ---
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
        exclude: .docker-cache/
      - id: check-toml
      - id: check-case-conflict       # 大小写冲突文件（跨平台）
      - id: check-symlinks
      - id: check-merge-conflict       # 残留冲突标记
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-executables-have-shebangs  # 可执行脚本必须有 shebang
      - id: forbid-new-submodules
      # --- 安全 ---
      - id: detect-private-key        # 私钥
      - id: no-commit-to-branch       # 禁止直接提交到受保护分支
        args: ["--branch", "main"]

  # ---------- 后端：Python 调试残留 + ruff + 类型 ----------
  - repo: local
    hooks:
      - id: backend-debug-statements
        name: 阻止调试残留 (后端 print/pdb/breakpoint)
        # \b 词边界避免 fingerprint( / sprint( 等标识符子串被误判为调试残留。
        # `_` 是 bash -c 的 $0 占位，避免吞掉第一个待检查文件。
        entry: bash -c 'if grep -rnE "\\bprint\\(|\\bpdb\\.|\\bbreakpoint\\(|\\bimport ipdb" "$@" 2>/dev/null; then echo "发现调试残留，请移除后提交"; exit 1; fi; exit 0' _
        language: system
        files: '^backend/.*\.py$'
        # scripts 下 print 是有意的 CLI 输出, 不是调试残留
        exclude: '(^backend/tests/|test_.*\.py$|__init__\.py$|^backend/scripts/)'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # v0.5.7 不认识 pyproject 中的 TRY203 选择器，会导致 "Failed to parse pyproject.toml"；
    # 阶段 1~5 的实际静态校验一直用 v0.11.0，这里对齐到同一版本，避免门禁配置漂移。
    rev: v0.11.0
    hooks:
      - id: ruff
        name: ruff-lint (后端)
        files: '^backend/.*\.py$'
        # --no-cache: 避免 .ruff_cache 在只读/他人所有目录下触发 cache 初始化失败。
        args: [--fix, --no-cache]
      - id: ruff-format
        name: ruff-format (后端)
        files: '^backend/.*\.py$'
        args: [--no-cache]

  # ---------- 后端：文件级行数门禁（增量，只统计本次改动 .py） ----------
  - repo: local
    hooks:
      - id: backend-file-length
        name: 文件行数门禁 (后端, 默认超 1000 行拦住)
        # 逻辑抽到独立脚本，避免内联 shell 的 YAML 转义问题。
        # 阈值默认 1000，可用环境变量 FILE_LINE_LIMIT 覆盖。
        entry: bash backend/scripts/check_file_length.sh
        language: system
        files: '^backend/.*\.py$'
        pass_filenames: true
        types: [python]
        # QG-04 已把原 strategy.py / storage/store.py 真实拆分为同名包，
        # 全部子模块 ≤1000 行；目录级/单文件豁免已全部移除。

      - id: backend-function-length
        name: 函数行数门禁 (后端, 单个函数/方法超 80 行拦住)
        # AST 统计 def/async def 起止行(含签名行与嵌套函数)；默认 80，
        # 可用环境变量 FUNC_LINE_LIMIT 覆盖。
        # 存量违规须在函数签名行写 `# func-length-allow: <理由>` 显式承认，
        # 理由必填，禁止静默忽略；grep func-length-allow 即可追踪全部例外。
        entry: python backend/scripts/check_function_length.py
        language: system
        files: '^backend/.*\.py$'
        pass_filenames: true
        types: [python]
        # QG-05 已真实拆分 strategy.py 全部函数至 ≤80 行，且文件已改为同名包；
        # 原单文件豁免已移除。

  # ---------- 后端：注释覆盖率门禁（增量，双向区间） ----------
  - repo: local
    hooks:
      - id: backend-comment-coverage
        name: 文档覆盖率门禁 (后端, 默认区间 5%~60%)
        # 硬门禁: 文档行 = 行注释 + docstring(与 code-quality.mdc 强制 docstring 一致)。
        # 用 tokenize 区分真正的 # 注释, 用 ast 精确识别 docstring, 避免误计普通字符串。
        # 低于 MIN → 文档化不足; 高于 MAX → 异常冗余。默认 8%~60%,
        # 可用环境变量 COMMENT_COVERAGE_MIN / COMMENT_COVERAGE_MAX 调整。
        entry: python backend/scripts/comment_coverage.py
        language: system
        files: '^backend/.*\.py$'
        pass_filenames: true
        types: [python]
        # 豁免: ①存量巨型文件(与行数钩子一致) ②scripts(CLI 输出为主) ③测试
        # (测试即文档, 用例名/断言自解释, 注释率天然低; 与 debug 钩子口径一致)。
        exclude: '^backend/app/(backtest/|tickflow/repository\.py|services/kline_sync\.py|strategy/paper\.py)|^backend/scripts/|^backend/tests/|test_.*\.py$'

  # ---------- 后端：mypy 类型检查（增量，只见改动文件） ----------
  - repo: local
    hooks:
      - id: backend-mypy
        name: mypy 类型检查 (后端)
        # `_` 是 bash -c 的 $0 占位；缺少它会让 mypy 漏检首个文件并在无参数时误报。
        entry: bash -c 'mypy --config-file backend/pyproject.toml "$@" 2>&1; code=$?; if [ $code -ne 0 ]; then echo "mypy 类型检查失败，请修复类型错误后重试"; fi; exit $code' _
        language: system
        files: '^backend/\.*(app|tests)/.*\.py$'
        pass_filenames: true
        types: [python]

  # ---------- 前端：TypeScript 类型检查（strict，基线干净） ----------
  - repo: local
    hooks:
      - id: frontend-typescript-typecheck
        name: tsc 类型检查 (前端)
        entry: bash -c 'cd frontend && pnpm exec tsc -b 2>&1; code=$?; if [ $code -ne 0 ]; then echo "tsc 类型检查失败，请修复类型错误后重试"; fi; exit $code'
        language: system
        files: '^frontend/.*\.(ts|tsx)$'
        pass_filenames: false
        types: [file]

# ---------- 未启用项及理由（不建议轻率加入） ----------
#
# 1) bandit（Python 安全扫描）：对存量会输出大量告警且需 baseline 文件维护，
#    提交侧由 detect-private-key + mypy 兜底，bandit 适合作为 CI 选做项而非提交门禁。
#
# 4) gitleaks（密钥/token 泄露扫描）：其 pre-commit 环境依赖 Go 工具链，本机首次安装
#    触发宿主 safe-delete 批量删除保护而无法完成；完整密钥扫描交由 CI 执行，
#    提交侧保留 detect-private-key 作为私钥兜底。
#
# 2) 前端 eslint/prettier：frontend 目前无 eslint、prettier 依赖。tsconfig 已是
#    strict + noUnusedLocals/Parmeters，被本项目 tsc 门禁覆盖。若要补 eslint，
#    需先向 devDependencies 装依赖并生成配置文件，才能接入。
#
# 3) check-docstring-first：要求模块/函数 docstring 放首行。后端多数模块满足，
#    少数存量违反会让其「首次被改动提交」受阻，故默认未启用；如需可自行加入。
#
# 说明：mypy 已启用（backend-mypy 钩子，见上方）。其 `[tool.mypy]` 取自渐进档，
#    只增量检查本次改动文件且 follow_imports=silent，配合 ignore_missing_imports；
#    严格度（如启用 strict）需待存量类型问题收敛后再酌情上调。
