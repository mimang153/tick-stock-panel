[project]
name = "tickflow-stock-panel-backend"
version = "0.3.37"
description = "A 股策略 + 监控 + 回测面板 — TickFlow 适配"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.6",
    "sse-starlette>=2.0",
    # Data
    # 1.44 起含流式引擎 executor 线程调度修复; 上限锁定一个已验证的大版本,
    # 升级需重跑 scripts/stress_polars_concurrency.py 压测 (并发死锁回归)。
    "polars>=1.44,<1.45",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "pandas>=2.2",                # 仅在 BacktestService 边界使用,见 §7.4 / ADR-19
    "psutil>=5.9",                # 独立回测 worker 的峰值 RSS 与退出后内存指标
    # llvmlite 不再提供 macOS Intel wheel；该平台使用 Matrix 纯 Python fallback。
    "numba>=0.65.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "fastexcel>=0.10",            # Polars 读取 xlsx/xls
    "pypinyin>=0.50",             # 股票名拼音首字母搜索 (同花顺式 payh → 平安银行)
    # TickFlow 官方 SDK
    "tickflow[all]>=0.1.23",
    # TdxQuant 内置数据源插件的原生 TCP 客户端 (wheel 自带跨平台库, 无需系统依赖)
    "tdxaidata>=1.2.2",
    # Scheduling
    "apscheduler>=3.10",
    # Config
    "pyyaml>=6.0",
    "packaging>=24.0",          # 外部插件版本与依赖兼容范围
    "python-dotenv>=1.0",
    # AI(可选,但默认装上)
    "openai>=1.66",               # OpenAI 兼容适配器复用 openai SDK; 1.66+ 提供 Responses API
    "httpx>=0.27",
    "platformdirs>=4.0",          # 桌面版用户数据目录 (跨平台持久可写)
    "winotify>=1.1; sys_platform == 'win32'",  # Windows 系统通知 (进操作中心)
    "plyer>=2.1",                 # 系统通知跨平台兜底 (macOS/Linux)
    # Watchlist screenshot OCR (Tesseract)
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "clickhouse-connect>=0.9",
    # PostgreSQL 事务层：模拟盘账户资金状态（DES-005），binary 自带 libpq 免系统依赖。
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# Legacy CPU runtime: install the Polars compatibility kernel on
# machines without AVX2/FMA support.
# Enable with: uv sync --extra legacy-cpu
legacy-cpu = [
    "polars[rtcompat]>=1.44,<1.45",
]

# vectorbt 还会引入绘图、交互组件等完整分析栈，仍保持为可选 extras。
# Matrix 引擎只直接依赖上面的 numba/llvmlite 编译内核。
# 启用:`uv sync --extra backtest`
backtest = [
    "vectorbt>=0.26",
]

# 多实例缓存后端：默认 memory，不需要该 extra；CACHE_BACKEND=redis 时使用。
cache-redis = [
    "redis>=5.0,<7",
]

# 桌面客户端依赖: pywebview 桌面窗口。打包用 (PyInstaller), 生产/Docker 不需要。
# 启用:`uv sync --extra desktop`
desktop = [
    "pywebview>=5.0",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "fakeredis>=2.20",
    "redis>=5.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE = flake8-blind-except: 禁止 `except Exception` 不留痕。
# 加它的理由: 本仓原有 271 处 `# noqa: BLE001` 而 `BLE` 竟未启用 ⇒ 那些 noqa 全是
# "无效指令"(RUF100), 即「禁止裸 except」当时**完全没有被强制**。启用后:
#   ①271 条既有 noqa 立即可用(实测 RUF100 293→46) ②将来新增的裸 except 必须显式承认。
# 实测本仓 backend/app: 1420 条 ⇒ 忽略 RUF001/2/3 后 611 条(其中 6 条是原先给 RUF001/2/3
#   写的 noqa 变为"无效指令") ⇒ 再启用 BLE 后 594 条(净减 826)。
# ⚠️ 仍会暴露 236 处**尚未表态**的 `except Exception`(soft-failure 设计, 见 CONTRIBUTING);
#    待工作区干净时用 `ruff check --select BLE001 --add-noqa` 批量显式承认, 不在有他人
#    未提交改动时做(会与在途改动冲突)。
# ⚠️ 本仓 CI 目前**不跑 ruff**(ci.yml 只有 `uv run pytest tests -q`) ⇒ 本改动不会打断 CI;
#    但正因如此, 这条门禁从来没人守——本改动让它**可执行**, 代价是 236 条既有沉默违规显形。
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "C90", "BLE", "PERF"]
# 仅在基础 select 之上追加的规则（不并入 select 以便独立追溯）。
# TRY = flake8-try(异常最佳实践, 对标 P3C 异常规约)。这里刻意只选**不强行改写
#   既有 try/except 结构**的子集:
#   - TRY400: 不要 `print()` 报错, 应 `raise` 传播 (error-instead-of-exception)
#   - TRY401: 用日志器而非裸 print 记录异常 (verbose-log-message)
#   - TRY203: 删掉无用的空 try/except (useless-try-except)
#   有意**不**加入 TRY300(try-consider-else)/TRY002/TRY003: 它们会强制重构现有
#   try/else 包裹方式, 对本仓数据/调度密集的上层包装弊大于利。实测 app 全量报 1313
#   条 TRY, 主要就是这类结构性条目撑起来的; pre-commit 增量下仍建议从轻量化子集开始。
# 实测: 本项(TRY 子集)+ PERF 对 backend/app 的存量, 分别约 +3 类(<=16 条)与 +45 条。
extend-select = ["TRY400", "TRY401", "TRY203", "PLR0915", "PLR0912"]
# PLR0915 = too-many-statements (函数体语句数, 默认 50)
# PLR0912 = too-many-branches   (函数内分支数,  默认 12)
# 二者合起来约束「单个函数别过长」, 与 mccabe C901(复杂度)配合构成函数级行数/规模底线。
# 增量(pre-commit)下只在改动文件触发; 数据/调度密集的大型既有函数若需放宽,
# 用 per-file-ignores 或对具体函数 `# noqa: PLR0915` 显式承认, 不静默删规则。
# 如需调整阈值, 见 `[tool.ruff.lint.pylint]` 的 max-statements / max-branches。
ignore = [
    "E501",    # 长行交给 fmt
    # 本仓注释/文档字符串以中文书写, 全角标点(，。：（）×)是正常书写而非笔误。
    # 不忽略会让「ruff error 清零」永远不可达: 实测 backend/app 共 1420 条告警,
    # 其中 RUF001/2/3 占 815 条(57.4%) ⇒ 忽略后降到 605 条, 门禁才谈得上可执行。
    "RUF001",  # String contains ambiguous unicode character
    "RUF002",  # Docstring contains ambiguous unicode character
    "RUF003",  # Comment contains ambiguous unicode character
]

[tool.ruff.lint.mccabe]
# 圈复杂度门禁：单函数/方法 ≤ 12（C901/McCabe，比默认 10 略宽松，
# 与后端数据/调度密集代码折中）。超限会被 pre-commit 的 ruff 钩子拦下。
# 若某个函数确实必须高复杂度，用 `# noqa: C901` 显式承认并说明。
max-complexity = 12

[tool.ruff.lint.pylint]
# PLR0915/PLR0912 阈值(函数级规模底线)。
# 注意 ruff 的 PLR0915 按「语句数」而非物理行数统计: 一个约 80 行的函数,
# 扣除 def 行、docstring、空行与括号续行后, 实际语句约 60 个。
# 故 max-statements=60 对应「函数体约 80 行为上限」(与 code-quality.mdc 一致)。
# 如需更严/更宽, 下调/上调即可; 该阈值只作用于被本次改动触碰的文件(增量)。
max-statements = 60
max-branches = 20

[tool.ruff.lint.per-file-ignores]
# 存量巨型文件豁免（阶段 5 已收敛）。
# matrix.py / engine.py 已在阶段 4 拆分达标，文件级豁免已移除；残留 7 处高复杂度函数
# 改用「行内 # noqa: C901 - 理由」显式承认，可在 PR 中逐条复审。
# 仅 strategy.py 仍为未拆分的存量巨型文件（3127 行，7 个 >80 行函数），保留文件级豁免，
# 并登记为待重构技术债；一旦拆分即移除本条，恢复全量约束。
"./app/backtest/strategy.py" = [
    "PLR0915", "PLR0912", "C901",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
# 类型检查门禁（渐进档，配合 pre-commit 增量钩子只查「本次改动文件」）。
# 设计意图：把好新写/改动的代码类型正确性，又不让存量历史问题阻塞每次提交
# （与 ruff 的增量思路一致，见 .pre-commit-config.yaml 与 CONTRIBUTING）。
# 因是增量，不用 strict 全量档；严格度可随存量逐步收敛后再上调。

python_version = "3.11"
# 从仓库根运行时用于定位 backend/app（mypy_path 相对 pre-commit 的 cwd=repo 根）。
mypy_path = ["backend"]
# 显式允许包基址解析（backend/app 非 src-layout，避免 "Cannot find implementation"
# 或 import 解析失败）。
explicit_package_bases = true
namespace_packages = true

# --- 渐进严格项（新代码会受益，存量不报死） ---
check_untyped_defs = true           # 对无注解函数也做内部类型推断
no_implicit_optional = true         # 禁止隐式 Optional（形如 `def f(x: str | None = None)` 必须写清）
warn_redundant_casts = true         # 冗余 cast 警告
warn_unused_configs = true
# 不启用 warn_unused_ignores：存量 `# type: ignore` 可能变为无效，会污染增量门禁。

# --- 第三方无 stub 的 SDK/驱动，一律当作 Any，不误报 ---
ignore_missing_imports = true

# 增量检查时，import 到的其它 backend/app 模块不展开深度报错，
# 只对被检查的改动文件自身做类型检查（避免连锁全量报错）。
follow_imports = "silent"
